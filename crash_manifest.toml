# DEFAULT.XEX SHA-256 f2389f9b8655e6432a78db8a4adc4cf524e5c56a6a92d013b6f0fb0452d4b425
#
# Two binaries: DEFAULT.XEX (Crash_X360_Release.exe, 0x82000000-0x82A20000)
# loads DLL/CRASH.DLL.XEX (Crash_X360_Release.dll.pe, 0x8A000000-0x8AE50000)
# at runtime via XexLoadImage. Each has its own functions table in an include
# file ending in [functions]; `rex triage` appends to the one whose binary
# holds the address (`rex modules` lists them).

[project]
name = "crash"
sdk_version = "0.10.0"
game_root = "game"

[entrypoint]
file_path = "game/DEFAULT.XEX"
out_directory_path = "generated/default"
includes = ["functions_default.toml"]

# Selecting Play looks up the player's gamertag with XUserFindUsers. Offline
# it fails synchronously, but the game ignores the return value and polls the
# never-completed (zeroed = "success") overlapped, parsing garbage. Complete
# the overlapped with the failure instead. Implemented in src/crash_hooks.cpp.
[[entrypoint.midasm_hook]]
name = "CrashFindUsersSyncFailure"
address = 0x821BA234
registers = ["r3", "r30"]

# Performance: the D3D GPU spin-wait step (sub_82203CB0) runs db16cyc delay
# hints that recompile to nothing, so every GPU wait pinned the main thread.
# Sleep briefly once per step instead. Implemented in src/crash_hooks.cpp.
[[entrypoint.midasm_hook]]
name = "CrashGpuWaitBackoff"
address = 0x82203CC4

# D3D swap scheduling (sub_8221EE10, same code as London's sub_825BDD40): the
# swap token carries the present interval (bits 8-11); Crash uses 2 (30 fps
# at 60 Hz). Rewrite it to 1 to present every vblank (cvar crash_60fps, which
# also sets the game's time step to 1/60 s: CrashFrameTimeStep in the DLL
# module below). Implemented in src/crash_hooks.cpp.
[[entrypoint.midasm_hook]]
name = "CrashSwapInterval"
address = 0x8221EE20
registers = ["r30"]

# CRASH.DLL.XEX SHA-256 bf66a2d38cf9a79dfe20558d289edb96b9f2346bf344613946a4ada897298338
# guest_path must match the normalized path the game passes to XexLoadImage
# (device prefix stripped, lowercase); a mismatch loads the DLL with no
# recompiled code and every call into 0x8A...... fails as unregistered.
[[modules]]
guest_path = "dll/crash.dll.xex"
file_path = "game/DLL/CRASH.DLL.XEX"
out_directory_path = "generated/crash_dll"
includes = ["functions_dll.toml"]

# Game time step, every frame (sub_8A1A718C's frame loop loads the per-frame
# delta from 0x8AE3F938 at 0x8A1A7D50): half the game's own 1/30 s while
# crash_60fps is on, unchanged when off, so it matches CrashSwapInterval even
# when the in-game menu toggles it. Implemented in src/crash_dll_hooks.cpp
# (built into the DLL module's library, see CMakeLists.txt).
[[modules.midasm_hook]]
name = "CrashFrameTimeStep"
address = 0x8A1A7D50
registers = ["r30"]
